<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanaware Deno PWA</title>
    <meta property="og:title" content="Vanaware Deno PWA" />
    <meta name="description" content="Simple HTML page served directly by Deno serveDir from dist" />
    <meta property="og:description" content="Simple HTML page served directly by Deno serveDir from dist" />
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --border-color: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent-color: #38bdf8;
        --accent-hover: #0284c7;
        --success-color: #22c55e;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 32px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background-color: rgba(34, 197, 94, 0.15);
        color: var(--success-color);
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      .badge::before {
        content: '';
        width: 8px;
        height: 8px;
        background-color: var(--success-color);
        border-radius: 50%;
      }
      h1 {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text-primary);
      }
      p.subtitle {
        color: var(--text-secondary);
        font-size: 15px;
        margin-bottom: 24px;
      }
      .info-list {
        background-color: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 24px;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid rgba(51, 65, 85, 0.4);
        font-size: 14px;
      }
      .info-row:last-child {
        border-bottom: none;
      }
      .info-label {
        color: var(--text-secondary);
      }
      .info-value {
        font-weight: 600;
        color: var(--accent-color);
        font-family: monospace;
      }
      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      button {
        background-color: var(--accent-color);
        color: #0f172a;
        font-weight: 600;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      button:hover {
        background-color: var(--accent-hover);
      }
      .status-text {
        font-size: 13px;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <main class="card" id="app">
      <span class="badge">Deno serveDir Ativo</span>
      <h1>Deno Dev Server</h1>
      <p class="subtitle">Servindo página HTML estática diretamente da pasta <code>dist/</code> com Deno nativo.</p>

      <div class="info-list">
        <div class="info-row">
          <span class="info-label">Runtime</span>
          <span class="info-value">Deno 2.9 (Native)</span>
        </div>
        <div class="info-row">
          <span class="info-label">Módulo Servidor</span>
          <span class="info-value">jsr:@std/http/file-server</span>
        </div>
        <div class="info-row">
          <span class="info-label">Pasta Raiz</span>
          <span class="info-value">./dist</span>
        </div>
        <div class="info-row">
          <span class="info-label">Porta Ingress</span>
          <span class="info-value">0.0.0.0:3000</span>
        </div>
      </div>

      <div class="actions">
        <button id="btn-test" onclick="handleClick()">Testar Interação (<span id="counter">0</span>)</button>
        <span class="status-text" id="status-msg">Clique para validar execução JavaScript</span>
      </div>
    </main>

    <script>
      let count = 0;
      function handleClick() {
        count++;
        document.getElementById('counter').innerText = count;
        document.getElementById('status-msg').innerText = 'JavaScript no navegador respondendo!';
      }
    </script>
  </body>
</html>
